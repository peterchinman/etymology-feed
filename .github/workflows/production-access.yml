name: Check production credentials

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/production-access.yml'
      - 'scripts/check-cloudflare-access.py'

permissions:
  contents: read

jobs:
  access:
    # Only owner-authored branches in this repository may use the deploy token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify token and read resource metadata without modifying production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/check-cloudflare-access.py
