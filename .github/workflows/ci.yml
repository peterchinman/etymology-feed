name: App checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:shared
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run test:shared
      - run: npm run test:dictionary
      - run: npm run test:report -w @etymology-feed/api
      - run: npm run build:web
      - run: npm run test:api
      - name: Install the browser used by the offline and account tests
        run: npx --no-install playwright install --with-deps chrome
      - name: Test offline use and account reconciliation with local D1
        run: npx --no-install playwright test --config apps/web/playwright.config.ts
      - name: Validate Worker packaging without deploying
        working-directory: apps/api
        run: npx --no-install wrangler deploy --dry-run
