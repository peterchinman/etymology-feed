name: App checks

on:
  pull_request:
  # main is checked once by deploy.yml through workflow_call before deployment.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check for a deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm run lint
      - if: runner.os == 'Linux'
        run: npm run typecheck:shared
      - if: runner.os == 'Linux'
        run: npm run typecheck:api
      - if: runner.os == 'Linux'
        run: npm run typecheck:web
      - if: runner.os == 'Linux'
        run: npm run test:unit
      - if: runner.os == 'Linux'
        run: npm run test:dictionary
      - if: runner.os == 'Linux'
        run: npm run test:report -w @etymology-feed/api
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - if: runner.os == 'Linux'
        run: node --test scripts/*.test.mjs
      - run: npm run build:web
      - if: runner.os == 'Linux'
        run: npm run test:api
      - name: Use the runner's Chrome or install it if unavailable
        run: node apps/web/scripts/ensure-browser.mjs
      - name: Test app behavior with local D1
        if: runner.os == 'Linux'
        run: npx --no-install playwright test --config apps/web/playwright.config.ts
      - name: Test native touch selection on macOS
        if: runner.os == 'macOS'
        run: npx --no-install playwright test --config apps/web/playwright.config.ts --grep @native
      - name: Keep browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.os }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Worker packaging without deploying
        if: runner.os == 'Linux'
        working-directory: apps/api
        run: npx --no-install wrangler deploy --dry-run
      - name: Validate production Worker packaging
        if: runner.os == 'Linux'
        working-directory: apps/api
        run: npx --no-install wrangler deploy --config wrangler.production.json --dry-run
